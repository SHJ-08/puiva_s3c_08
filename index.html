<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詩句星圖</title>
<style>
  :root {
    --ink: #242018;
    --muted: #716c61;
    --paper: #f7f3e8;
    --paper-deep: #ebe3d1;
    --line: #d8cbb4;
    --jade: #2f7d68;
    --jade-dark: #1f5d50;
    --cinnabar: #b84a3a;
    --gold: #d39b45;
    --indigo: #293d63;
    --white: #fffdfa;
    --shadow: 0 18px 45px rgba(64, 50, 27, 0.16);
    --radius: 8px;
    --font-ui: "標楷體", "BiauKai", "DFKai-SB", "KaiTi", "Kaiti TC", "PMingLiU", serif;
    --font-display: "標楷體", "BiauKai", "DFKai-SB", "KaiTi", "Kaiti TC", "PMingLiU", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    background:
      linear-gradient(115deg, rgba(47, 125, 104, 0.18), transparent 34%),
      linear-gradient(300deg, rgba(184, 74, 58, 0.14), transparent 46%),
      linear-gradient(180deg, #f4efe1 0%, #e8f0e9 48%, #f6eadb 100%);
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  .app-shell {
    width: min(1180px, calc(100% - 28px));
    min-height: calc(100vh - 28px);
    margin: 14px auto;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background:
      linear-gradient(rgba(122, 99, 51, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122, 99, 51, 0.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.72), rgba(255,255,255,0.55)),
      var(--paper);
    background-size: 26px 26px, 26px 26px, auto, auto;
    border: 1px solid rgba(116, 97, 61, 0.24);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px 24px 16px;
    background:
      linear-gradient(100deg, rgba(47,125,104,0.16), rgba(255,255,255,0.45) 48%, rgba(184,74,58,0.13)),
      var(--white);
    border-bottom: 1px solid rgba(116, 97, 61, 0.16);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .brand-mark {
    width: 58px;
    height: 58px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    color: #fff8e7;
    font-family: var(--font-ui);
    font-size: 34px;
    background:
      radial-gradient(circle at 70% 20%, rgba(255,255,255,0.32), transparent 24%),
      linear-gradient(145deg, var(--cinnabar), var(--jade-dark));
    box-shadow: inset 0 -8px 16px rgba(0,0,0,0.13);
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(25px, 4vw, 38px);
    letter-spacing: 0;
    line-height: 1;
  }

  .brand p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .brand-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
    padding: 4px 9px;
    color: var(--jade-dark);
    background: rgba(47, 125, 104, 0.10);
    border: 1px solid rgba(47, 125, 104, 0.16);
    border-radius: 999px;
    font-size: 12px;
  }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(78px, 1fr));
    gap: 8px;
    flex: 1 1 360px;
    min-width: min(420px, 42vw);
  }

  .stat {
    padding: 10px 12px;
    background: rgba(255, 253, 250, 0.82);
    border: 1px solid rgba(116, 97, 61, 0.16);
    border-radius: var(--radius);
    box-shadow: 0 8px 18px rgba(64, 50, 27, 0.06);
  }

  .stat strong {
    display: block;
    font-size: 21px;
    line-height: 1.1;
  }

  .stat span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: rgba(255, 253, 250, 0.78);
    border-bottom: 1px solid rgba(116, 97, 61, 0.16);
    overflow-x: auto;
  }

  .tab-button {
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 13px;
    color: var(--muted);
    background: transparent;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .tab-button.active {
    color: #fff;
    background: var(--jade-dark);
    box-shadow: 0 8px 18px rgba(31, 93, 80, 0.20);
  }

  .workspace {
    min-height: 0;
    padding: 20px 24px 24px;
    overflow: auto;
  }

  .practice-layout {
    display: grid;
    grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
    gap: 18px;
    min-height: 100%;
  }

  .panel {
    background: rgba(255, 253, 250, 0.86);
    border: 1px solid rgba(116, 97, 61, 0.18);
    border-radius: var(--radius);
    box-shadow: 0 10px 26px rgba(64, 50, 27, 0.08);
    backdrop-filter: blur(14px);
  }

  .poet-panel {
    min-height: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(116, 97, 61, 0.14);
  }

  .panel-title h2 {
    margin: 0;
    font-size: 18px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    color: var(--muted);
    background: rgba(235, 227, 209, 0.62);
    border: 1px solid rgba(116, 97, 61, 0.14);
    font-size: 12px;
    white-space: nowrap;
  }

  .segmented {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    gap: 6px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(116, 97, 61, 0.14);
  }

  .segmented button {
    min-height: 34px;
    color: var(--muted);
    background: rgba(247, 243, 232, 0.92);
    border: 1px solid rgba(116, 97, 61, 0.14);
    border-radius: var(--radius);
    font-size: 13px;
  }

  .segmented button.active {
    color: #fff;
    background: var(--cinnabar);
    border-color: var(--cinnabar);
  }

  .poet-list {
    overflow: auto;
    padding: 10px;
    display: grid;
    gap: 8px;
  }

  .poet-card {
    width: 100%;
    display: grid;
    grid-template-columns: 54px 1fr auto;
    align-items: center;
    gap: 11px;
    padding: 10px;
    text-align: left;
    color: var(--ink);
    background: rgba(255,255,255,0.58);
    border: 1px solid transparent;
    border-radius: var(--radius);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .poet-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(64, 50, 27, 0.10);
  }

  .poet-card.active {
    background: #fff;
    border-color: rgba(47, 125, 104, 0.34);
    box-shadow: 0 9px 20px rgba(47, 125, 104, 0.12);
  }

  .avatar-img {
    width: 54px;
    height: 54px;
    display: block;
    border-radius: var(--radius);
    border: 1px solid rgba(36, 32, 24, 0.12);
    background: var(--paper-deep);
    object-fit: cover;
    box-shadow: 0 10px 22px rgba(34, 29, 20, 0.14);
  }

  .poet-name {
    margin: 0;
    font-size: 16px;
    line-height: 1.1;
  }

  .poet-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .progress-track {
    height: 5px;
    margin-top: 8px;
    background: rgba(116, 97, 61, 0.14);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: var(--progress, 0%);
    background: linear-gradient(90deg, var(--jade), var(--gold));
  }

  .poet-count {
    align-self: start;
    color: var(--muted);
    font-size: 12px;
  }

  .study-panel {
    min-width: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 14px;
  }

  .hero-card {
    position: relative;
    overflow: hidden;
    min-height: 230px;
    padding: 22px;
    color: #fffaf0;
    background:
      linear-gradient(115deg, rgba(31,93,80,0.95), rgba(41,61,99,0.92) 58%, rgba(184,74,58,0.90)),
      var(--jade-dark);
    border-radius: var(--radius);
    box-shadow: 0 20px 38px rgba(31, 93, 80, 0.18);
  }

  .hero-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, black, transparent 75%);
  }

  .hero-content {
    position: relative;
    display: grid;
    grid-template-columns: 112px 1fr;
    align-items: center;
    gap: 18px;
  }

  .hero-avatar {
    width: 112px;
    height: 112px;
    border-radius: var(--radius);
    border: 3px solid rgba(255,250,240,0.66);
    background: rgba(255,255,255,0.12);
    object-fit: cover;
    box-shadow: 0 16px 30px rgba(0,0,0,0.22);
  }

  .hero-content h2 {
    margin: 0;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1;
  }

  .hero-content p {
    margin: 10px 0 0;
    max-width: 680px;
    color: rgba(255,250,240,0.82);
    line-height: 1.7;
  }

  .hero-stats {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .hero-stats .chip {
    color: #fff8e7;
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.18);
  }

  .question-card {
    padding: 0;
    overflow: hidden;
  }

  .question-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 20px 12px;
    margin-bottom: 0;
  }

  .question-head h3 {
    margin: 0;
    font-size: 18px;
  }

  .difficulty {
    color: #fff;
    border: 0;
  }

  .difficulty.easy,
  .difficulty.starter { background: #5dd7bf; }
  .difficulty.basic { background: var(--jade); }
  .difficulty.medium { background: var(--gold); }
  .difficulty.advanced { background: #8f78ff; }
  .difficulty.hard { background: var(--cinnabar); }

  .recite-stage {
    padding: 0 20px 20px;
  }

  .poem-title-card {
    min-height: 108px;
    display: grid;
    align-content: center;
    gap: 8px;
    padding: 18px 20px;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(47,125,104,0.10), transparent),
      #fffaf1;
    border: 1px solid rgba(116, 97, 61, 0.18);
    border-radius: var(--radius);
  }

  .poem-title-card strong {
    display: block;
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.25;
  }

  .poem-title-card span {
    color: var(--muted);
    font-size: 14px;
  }

  .line-blueprint {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .line-slot {
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    color: rgba(36, 32, 24, 0.58);
    background: rgba(255, 255, 255, 0.72);
    border: 1px dashed rgba(116, 97, 61, 0.24);
    border-radius: var(--radius);
    font-size: 13px;
  }

  .line-slot b {
    color: var(--jade-dark);
    font-size: 12px;
  }

  .answer-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 14px;
  }

  .answer-row textarea {
    width: 100%;
    min-height: 170px;
    resize: vertical;
    padding: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid rgba(116, 97, 61, 0.28);
    border-radius: var(--radius);
    outline: 0;
    line-height: 1.75;
  }

  .answer-row textarea:focus {
    border-color: var(--jade);
    box-shadow: 0 0 0 3px rgba(47, 125, 104, 0.12);
  }

  .submit-column {
    display: grid;
    gap: 8px;
    align-content: start;
  }

  .primary-btn,
  .ghost-btn,
  .danger-btn {
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 14px;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .primary-btn {
    color: #fff;
    background: var(--jade-dark);
  }

  .ghost-btn {
    color: var(--ink);
    background: rgba(247, 243, 232, 0.88);
    border: 1px solid rgba(116, 97, 61, 0.18);
  }

  .danger-btn {
    color: #fff;
    background: var(--cinnabar);
  }

  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 12px;
  }

  .feedback {
    min-height: 36px;
    margin-top: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  .feedback.good { color: var(--jade-dark); }
  .feedback.bad { color: var(--cinnabar); }

  .answer-sheet {
    display: grid;
    gap: 7px;
    margin-top: 12px;
    padding: 12px;
    background: rgba(255,250,241,0.86);
    border: 1px solid rgba(116, 97, 61, 0.16);
    border-radius: var(--radius);
  }

  .answer-line {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: baseline;
    color: var(--ink);
    line-height: 1.7;
  }

  .answer-line span {
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 999px;
    color: #fff;
    background: var(--jade-dark);
    font-size: 13px;
  }

  .poem-bank {
    min-height: 0;
    padding: 16px;
  }

  .bank-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .bank-head h3 {
    margin: 0;
    font-size: 18px;
  }

  .poem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .poem-item {
    min-height: 78px;
    padding: 10px;
    text-align: left;
    color: var(--ink);
    background: #fff;
    border: 1px solid rgba(116, 97, 61, 0.16);
    border-radius: var(--radius);
  }

  .poem-item.active {
    border-color: var(--jade);
    box-shadow: 0 0 0 3px rgba(47, 125, 104, 0.10);
  }

  .poem-item strong {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
  }

  .poem-item span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .library-grid,
  .wrong-list,
  .achievement-grid {
    display: grid;
    gap: 12px;
  }

  .library-grid {
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }

  .library-card,
  .wrong-card,
  .achievement-card {
    background: rgba(255,253,250,0.88);
    border: 1px solid rgba(116, 97, 61, 0.18);
    border-radius: var(--radius);
    padding: 14px;
  }

  .library-card {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 12px;
  }

  .library-card .avatar-img {
    width: 64px;
    height: 64px;
  }

  .library-card h3,
  .wrong-card h3,
  .achievement-card h3 {
    margin: 0;
    font-size: 18px;
  }

  .library-card p,
  .wrong-card p,
  .achievement-card p {
    margin: 8px 0 0;
    color: var(--muted);
    line-height: 1.6;
    font-size: 14px;
  }

  .mini-poems {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }

  .wrong-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .wrong-card {
    display: grid;
    gap: 10px;
  }

  .wrong-lines {
    padding: 12px;
    border-radius: var(--radius);
    background: #fffaf1;
    border: 1px solid rgba(116, 97, 61, 0.14);
  }

  .wrong-lines strong {
    display: block;
    font-size: 20px;
    line-height: 1.5;
  }

  .wrong-lines span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
  }

  .empty-state {
    display: grid;
    place-items: center;
    min-height: 280px;
    text-align: center;
    color: var(--muted);
    background: rgba(255,253,250,0.80);
    border: 1px dashed rgba(116, 97, 61, 0.32);
    border-radius: var(--radius);
    padding: 24px;
  }

  .empty-state strong {
    display: block;
    color: var(--ink);
    font-size: 24px;
    margin-bottom: 8px;
  }

  .achievement-grid {
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }

  .achievement-card {
    min-height: 142px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-content: start;
  }

  .badge-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: #fff8e7;
    background: var(--jade-dark);
    border-radius: var(--radius);
    font-size: 22px;
  }

  .achievement-card.locked {
    opacity: 0.48;
    filter: grayscale(0.7);
  }

  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    max-width: min(360px, calc(100vw - 36px));
    padding: 12px 14px;
    color: #fff;
    background: var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 16px 38px rgba(0,0,0,0.22);
    transform: translateY(120%);
    opacity: 0;
    transition: all 0.28s ease;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  @media (max-width: 850px) {
    .app-shell {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      border: 0;
      border-radius: 0;
    }

    .topbar {
      align-items: stretch;
      flex-direction: column;
      padding: 16px;
    }

    .stat-strip {
      min-width: 0;
      grid-template-columns: repeat(2, 1fr);
    }

    .energy-bar-wrap {
      width: 100%;
      min-width: 0;
    }

    .tabs {
      padding: 8px 16px;
    }

    .workspace {
      padding: 14px 16px 18px;
    }

    .practice-layout {
      grid-template-columns: 1fr;
    }

    .poet-panel {
      max-height: none;
    }

    .poet-list {
      grid-auto-flow: column;
      grid-auto-columns: minmax(230px, 1fr);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .hero-content {
      grid-template-columns: 70px 1fr;
    }

    .hero-avatar {
      width: 70px;
      height: 70px;
    }

    .answer-row {
      grid-template-columns: 1fr;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn {
      width: 100%;
    }
  }

  @media (max-width: 520px) {
    .brand-mark {
      width: 50px;
      height: 50px;
      font-size: 30px;
    }

    .brand h1 {
      font-size: 27px;
    }

    .brand p {
      font-size: 13px;
    }

    .question-head,
    .bank-head,
    .wrong-toolbar {
      align-items: stretch;
      flex-direction: column;
    }

    .segmented {
      grid-template-columns: repeat(2, 1fr);
    }

    .poem-title-card {
      min-height: 96px;
    }
  }

  /* ===========================
     星穹書院遊戲皮膚
     =========================== */
  :root {
    --ink: #fff4cf;
    --muted: #b9d3d4;
    --paper: rgba(9, 21, 44, 0.82);
    --paper-deep: rgba(14, 31, 59, 0.92);
    --line: rgba(244, 204, 126, 0.28);
    --jade: #35d3b4;
    --jade-dark: #14876f;
    --cinnabar: #f05d56;
    --gold: #ffd37a;
    --indigo: #273d73;
    --white: #fffaf0;
    --shadow: 0 26px 80px rgba(0, 0, 0, 0.42);
    --radius: 18px;
    --pointer-x: 50%;
    --pointer-y: 42%;
  }

  body {
    color: var(--ink);
    background-image:
      radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 230, 164, 0.08), transparent 22%),
      linear-gradient(180deg, rgba(2, 8, 22, 0.32), rgba(2, 8, 22, 0.78)),
      url("assets/ui/academy-lobby.png");
    background-position: 50% 42%, center, center;
    background-size: 120% 120%, cover, cover;
    background-attachment: fixed, fixed, fixed;
    background-repeat: no-repeat;
    animation: backgroundDrift 26s ease-in-out infinite alternate;
    overflow-x: hidden;
  }

  .ambient-ui {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,0.04), transparent 16%),
      linear-gradient(120deg, rgba(53,211,180,0.025), transparent 34%, rgba(255,211,122,0.03));
  }

  .ambient-ui span {
    position: absolute;
    width: min(54vw, 760px);
    aspect-ratio: 1.55;
    border-radius: 999px;
    filter: blur(38px);
    opacity: 0.20;
    transform: translate3d(calc((var(--pointer-x-num, 0.5) - 0.5) * 18px), calc((var(--pointer-y-num, 0.42) - 0.42) * 14px), 0);
    mix-blend-mode: screen;
    animation: flowRibbon 18s ease-in-out infinite alternate;
  }

  .ambient-ui span:nth-child(1) {
    left: -12%;
    top: 4%;
    background: linear-gradient(135deg, rgba(53,211,180,0.38), rgba(88,124,255,0.16));
  }

  .ambient-ui span:nth-child(2) {
    right: -16%;
    top: 20%;
    background: linear-gradient(135deg, rgba(255,211,122,0.34), rgba(240,93,86,0.16));
    animation-duration: 22s;
    animation-direction: alternate-reverse;
  }

  .ambient-ui span:nth-child(3) {
    left: 24%;
    bottom: -18%;
    background: linear-gradient(135deg, rgba(100,235,213,0.22), rgba(255,255,255,0.10));
    animation-duration: 26s;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 18%, rgba(53, 211, 180, 0.12), transparent 42%),
      radial-gradient(ellipse at 82% 12%, rgba(255, 211, 122, 0.12), transparent 38%),
      linear-gradient(120deg, rgba(255,255,255,0.045), transparent 46%, rgba(53,211,180,0.04));
    opacity: 0.68;
    filter: blur(0.2px);
    animation: ambientFloat 22s ease-in-out infinite alternate;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.8) 0 1px, transparent 2px),
      radial-gradient(circle at 72% 24%, rgba(255, 211, 122, 0.75) 0 1px, transparent 2px),
      radial-gradient(circle at 48% 8%, rgba(53, 211, 180, 0.72) 0 1px, transparent 2px),
      radial-gradient(circle at 86% 50%, rgba(255, 255, 255, 0.65) 0 1px, transparent 2px);
    opacity: 0.38;
    transform: translate3d(0, 0, 0);
    animation: particleDrift 18s ease-in-out infinite alternate;
  }

  body > * {
    position: relative;
    z-index: 1;
  }

  .app-shell {
    width: min(1680px, calc(100% - 20px));
    height: calc(100vh - 20px);
    min-height: 720px;
    margin: 10px auto;
    grid-template-rows: auto 1fr;
    background:
      linear-gradient(135deg, rgba(255, 211, 122, 0.10), transparent 34%),
      linear-gradient(315deg, rgba(53, 211, 180, 0.11), transparent 38%),
      rgba(4, 13, 31, 0.76);
    background-size: auto;
    border: 1px solid rgba(255, 221, 151, 0.36);
    box-shadow:
      0 0 0 1px rgba(53, 211, 180, 0.10) inset,
      0 30px 100px rgba(0, 0, 0, 0.50),
      0 0 48px rgba(53, 211, 180, 0.10);
    backdrop-filter: blur(18px) saturate(1.18);
    overflow: hidden;
  }

  .app-head {
    position: sticky;
    top: 0;
    z-index: 25;
    transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  }

  .app-shell.header-stuck .app-head {
    box-shadow:
      0 18px 46px rgba(0,0,0,0.34),
      0 1px 0 rgba(255, 211, 122, 0.18);
  }

  @keyframes backgroundDrift {
    0% { background-position: 49% 40%, center, center; }
    100% { background-position: 55% 46%, center, center; }
  }

  @keyframes ambientFloat {
    0% { transform: translate3d(-1.4%, -1%, 0) scale(1); opacity: 0.62; }
    100% { transform: translate3d(1.5%, 1.2%, 0) scale(1.03); opacity: 0.84; }
  }

  @keyframes particleDrift {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(12px, -16px, 0); }
  }

  @keyframes flowRibbon {
    0% { transform: translate3d(-4%, -3%, 0) rotate(-8deg) scale(1); }
    50% { transform: translate3d(5%, 2%, 0) rotate(4deg) scale(1.06); }
    100% { transform: translate3d(2%, 5%, 0) rotate(10deg) scale(0.96); }
  }

  @keyframes tapBounce {
    0% { transform: scale(1); }
    38% { transform: scale(0.965); }
    72% { transform: scale(1.025); }
    100% { transform: scale(1); }
  }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  button {
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
  }

  button::before {
    content: "";
    position: absolute;
    inset: -1px;
    pointer-events: none;
    background:
      radial-gradient(circle at var(--hover-x, 50%) var(--hover-y, 50%), rgba(255,255,255,0.34), transparent 28%),
      linear-gradient(135deg, rgba(255,211,122,0.18), rgba(53,211,180,0.14));
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  button.is-hovered::before,
  button:hover::before,
  button:focus-visible::before {
    opacity: 1;
    transform: scale(1);
  }

  button.is-hovered,
  button:hover,
  button:focus-visible {
    border-color: rgba(255, 225, 151, 0.54);
    filter: brightness(1.08) saturate(1.08);
    box-shadow:
      0 0 0 1px rgba(255, 225, 151, 0.20) inset,
      0 0 24px rgba(255, 211, 122, 0.20),
      0 12px 28px rgba(53, 211, 180, 0.14);
  }

  button:focus-visible {
    outline: 2px solid rgba(255, 211, 122, 0.72);
    outline-offset: 3px;
  }

  button.tap-bounce {
    animation: tapBounce 0.34s cubic-bezier(.22, 1.18, .36, 1);
  }

  .tab-button,
  .segmented button,
  .poet-card,
  .poem-item,
  .grade-option,
  .primary-btn,
  .ghost-btn,
  .danger-btn,
  .achievement-card {
    will-change: transform;
    transition-timing-function: cubic-bezier(.22, .8, .28, 1);
  }

  .tab-button:active,
  .segmented button:active,
  .poet-card:active,
  .poem-item:active,
  .grade-option:active,
  .primary-btn:active,
  .ghost-btn:active,
  .danger-btn:active,
  .achievement-card:active {
    transform: scale(0.985);
  }

  .app-shell {
    border-radius: 30px;
  }

  .panel,
  .library-card,
  .wrong-card,
  .achievement-card,
  .modal-panel,
  .question-card,
  .poem-title-card {
    border-radius: 24px;
  }

  .poet-card,
  .poem-item,
  .grade-option,
  .tab-button,
  .primary-btn,
  .ghost-btn,
  .danger-btn,
  .answer-row textarea,
  .gate-form input {
    border-radius: 18px;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ===== 主題切換過渡 ===== */
  body,
  .app-shell,
  .topbar,
  .panel,
  .question-card,
  .poet-card,
  .poem-item,
  .stat,
  .tabs,
  .tab-button,
  .segmented button,
  .primary-btn,
  .ghost-btn,
  .danger-btn,
  .line-slot,
  .cloze-card,
  .blank-input,
  .answer-row textarea,
  .answer-sheet,
  .poem-title-card,
  .achievement-card,
  .library-card,
  .wrong-card,
  .poet-bio-card,
  .music-player,
  .modal-panel {
    transition: background 0.4s ease, color 0.3s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  }

  /* ===== 淺色主題 ===== */
  body.light-theme {
    --ink: #2c2820;
    --muted: #6b6560;
    --paper: rgba(252, 249, 242, 0.95);
    --paper-deep: rgba(240, 234, 220, 0.96);
    --line: #d8cbb4;
    --jade: #2f7d68;
    --jade-dark: #1f5d50;
    --cinnabar: #b84a3a;
    --gold: #c8923a;
    --indigo: #293d63;
    --white: #fffdf8;
    --shadow: 0 18px 45px rgba(64, 50, 27, 0.16);
    --radius: 8px;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 22%, rgba(47, 125, 104, 0.12), transparent 42%),
      radial-gradient(circle at 78% 18%, rgba(211, 155, 69, 0.10), transparent 36%),
      radial-gradient(circle at 50% 85%, rgba(184, 74, 58, 0.06), transparent 38%),
      radial-gradient(circle at 40% 50%, rgba(41, 61, 99, 0.04), transparent 40%),
      linear-gradient(115deg, rgba(47, 125, 104, 0.08), transparent 42%),
      linear-gradient(300deg, rgba(184, 74, 58, 0.06), transparent 52%),
      linear-gradient(180deg, #f8f4ec 0%, #eef4f0 35%, #f6f0e4 65%, #f4efe1 100%);
    background-attachment: fixed;
  }

  /* 日間模式沉浸式氛圍 */
  body.light-theme::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 12%, rgba(47, 125, 104, 0.16), transparent 50%),
      radial-gradient(ellipse at 85% 20%, rgba(211, 155, 69, 0.14), transparent 45%),
      radial-gradient(ellipse at 55% 80%, rgba(41, 61, 99, 0.08), transparent 42%),
      radial-gradient(ellipse at 30% 60%, rgba(184, 74, 58, 0.06), transparent 35%),
      radial-gradient(ellipse at 65% 35%, rgba(47, 125, 104, 0.06), transparent 30%);
    opacity: 0.9;
    filter: blur(0.5px);
    animation: ambientFloat 28s ease-in-out infinite alternate;
    z-index: 0;
  }

  body.light-theme::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 22% 28%, rgba(47, 125, 104, 0.10) 0 2px, transparent 4px),
      radial-gradient(circle at 58% 15%, rgba(211, 155, 69, 0.09) 0 1.5px, transparent 3px),
      radial-gradient(circle at 38% 72%, rgba(41, 61, 99, 0.08) 0 1.5px, transparent 3px),
      radial-gradient(circle at 78% 55%, rgba(47, 125, 104, 0.09) 0 2px, transparent 3.5px),
      radial-gradient(circle at 12% 80%, rgba(200, 146, 58, 0.08) 0 1.5px, transparent 3px),
      radial-gradient(circle at 90% 40%, rgba(47, 125, 104, 0.07) 0 1px, transparent 2.5px),
      radial-gradient(circle at 45% 90%, rgba(211, 155, 69, 0.06) 0 1px, transparent 2px);
    opacity: 0.65;
    animation: particleDrift 24s ease-in-out infinite alternate;
    z-index: 0;
  }

  body.light-theme .ambient-ui {
    display: block;
  }

  body.light-theme .ambient-ui span {
    opacity: 0.22;
    filter: blur(38px);
    background: none;
    animation-duration: 22s, 28s, 32s;
  }

  body.light-theme .ambient-ui span:nth-child(1) {
    background: linear-gradient(135deg, rgba(47,125,104,0.32), rgba(47,125,104,0.10));
  }

  body.light-theme .ambient-ui span:nth-child(2) {
    background: linear-gradient(135deg, rgba(211,155,69,0.28), rgba(211,155,69,0.08));
  }

  body.light-theme .ambient-ui span:nth-child(3) {
    background: linear-gradient(135deg, rgba(100,160,210,0.20), rgba(255,255,255,0.16));
  }

  body.light-theme .app-shell {
    width: min(1180px, calc(100% - 28px));
    height: auto;
    min-height: calc(100vh - 28px);
    margin: 14px auto;
    grid-template-rows: auto auto 1fr;
    background:
      linear-gradient(rgba(140, 120, 80, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 120, 80, 0.018) 1px, transparent 1px),
      radial-gradient(ellipse at 10% 0%, rgba(47, 125, 104, 0.04), transparent 50%),
      radial-gradient(ellipse at 90% 100%, rgba(211, 155, 69, 0.04), transparent 50%),
      linear-gradient(90deg, rgba(255,255,255,0.85), rgba(255,255,255,0.70)),

    background-size: 26px 26px, 26px 26px, auto, auto, auto, auto;
    border: 1px solid rgba(116, 97, 61, 0.18);
    box-shadow: 0 20px 60px rgba(64, 50, 27, 0.08), 0 0 0 1px rgba(255,255,255,0.5) inset;

  /* ===== 成長激勵系統 ===== */
  .energy-bar-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex: 0 1 500px;
    gap: 12px;
    min-width: min(440px, 100%);
    padding: 10px 12px;
    color: #fff8d8;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 211, 122, 0.22), transparent 34%),
      linear-gradient(135deg, rgba(255,255,255,0.13), rgba(255,255,255,0.045)),
      rgba(5, 16, 35, 0.58);
    border: 1px solid rgba(255, 211, 122, 0.28);
    border-radius: 22px;
    box-shadow:
      0 16px 34px rgba(0,0,0,0.22),
      inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(16px) saturate(1.12);
  }

  .star-row {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    padding: 7px 9px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255, 211, 122, 0.18);
    border-radius: 999px;
  }

  .star-icon {
    font-size: 20px;
    line-height: 1;
    color: rgba(255,255,255,0.18);
    transition: color 0.4s ease, text-shadow 0.4s ease, transform 0.3s ease;
  }

  .star-icon.active {
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 211, 122, 0.50);
    animation: starPop 0.5s cubic-bezier(.22, 1.18, .36, 1);
  }

  .star-icon.earned {
    color: var(--gold);
    text-shadow: 0 0 8px rgba(255, 211, 122, 0.30);
  }

  @keyframes starPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.4) rotate(12deg); }
    70% { transform: scale(0.9) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .energy-track-wrap {
    flex: 1;
    min-width: 130px;
    max-width: 250px;
  }

  .energy-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
  }

  .energy-level {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 211, 122, 0.30);
  }

  .energy-points {
    font-size: 12px;
    color: #cce4e3;
  }

  .energy-track {
    height: 11px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .energy-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #35d3b4 0%, #9bf5dc 42%, #ffd37a 100%);
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(.22, .8, .28, 1);
    box-shadow: 0 0 16px rgba(53, 211, 180, 0.30);
    position: relative;
  }

  .energy-fill::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 18px;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35));
    border-radius: 999px;
  }

  .energy-fill.max {
    background: linear-gradient(90deg, #35d3b4, #ffd37a, #ff7a67);
    box-shadow: 0 0 16px rgba(255, 211, 122, 0.40);
    animation: energyPulse 2s ease-in-out infinite;
  }

  @keyframes energyPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

    "wangwei:使至塞上": "單車欲問邊|屬國過居延|徵蓬出漢塞|歸雁入胡天|大漠孤煙直|長河落日圓|蕭關逢候騎|都護在燕然",
    "wangwei:終南別業": "中歲頗好道|晚家南山陲|興來每獨往|勝事空自知|行到水窮處|坐看雲起時|偶然值林叟|談笑無還期",

    "wangwei:相思": "紅豆生南國|春來發幾枝|願君多采擷|此物最相思",

    "wangwei:觀獵": "風勁角弓鳴|將軍獵渭城|草枯鷹眼疾|雪盡馬蹄輕|忽過新豐市|還歸細柳營|回看射鵰處|千里暮雲平",
    "wangwei:歸嵩山作": "清川帶長薄|車馬去閒閒|流水如有意|暮禽相與還|荒城臨古渡|落日滿秋山|迢遞嵩高下|歸來且閉關",
    "wangwei:過香積寺": "不知香積寺|數里入雲峰|古木無人徑|深山何處鐘|泉聲咽危石|日色冷青松|薄暮空潭曲|安禪製毒龍",

    "sushi:水調歌頭": "明月幾時有|把酒問青天|不知天上宮闕|今夕是何年|我欲乘風歸去|又恐瓊樓玉宇|高處不勝寒|起舞弄清影|何似在人間|轉朱閣|低綺戶|照無眠|不應有恨|何事長向別時圓|人有悲歡離合|月有陰晴圓缺|此事古難全|但願人長久|千里共嬋娟",
    "sushi:題西林壁": "橫看成嶺側成峰|遠近高低各不同|不識廬山真面目|只緣身在此山中",
    "sushi:惠崇春江晚景": "竹外桃花三兩枝|春江水暖鴨先知|蔞蒿滿地蘆芽短|正是河豚欲上時",
    "sushi:飲湖上初晴後雨": "水光瀲灩晴方好|山色空濛雨亦奇|欲把西湖比西子|淡妝濃抹總相宜",
    "sushi:念奴嬌·赤壁懷古": "大江東去|浪淘盡|千古風流人物|故壘西邊|人道是|三國周郎赤壁|亂石穿空|驚濤拍岸|捲起千堆雪|江山如畫|一時多少豪傑|遙想公瑾當年|小喬初嫁了|雄姿英發|羽扇綸巾|談笑間|檣櫓灰飛煙滅|故國神遊|多情應笑我|早生華髮|人生如夢|一尊還酹江月",
    "sushi:六月二十七日望湖樓醉書": "黑雲翻墨未遮山|白雨跳珠亂入船|卷地風來忽吹散|望湖樓下水如天",
    "sushi:定風波": "莫聽穿林打葉聲|何妨吟嘯且徐行|竹杖芒鞋輕勝馬|誰怕|一蓑煙雨任平生|料峭春風吹酒醒|微冷|山頭斜照卻相迎|回首向來蕭瑟處|歸去|也無風雨也無晴",
    "sushi:贈劉景文": "荷盡已無擎雨蓋|菊殘猶有傲霜枝|一年好景君須記|最是橙黃橘綠時",
    "sushi:江城子·密州出獵": "老夫聊發少年狂|左牽黃|右擎蒼|錦帽貂裘|千騎卷平岡|為報傾城隨太守|親射虎|看孫郎|酒酣胸膽尚開張|鬢微霜|又何妨|持節雲中|何日遣馮唐|會挽雕弓如滿月|西北望|射天狼",
    "sushi:江城子·乙卯正月二十日夜記夢": "十年生死兩茫茫|不思量|自難忘|千里孤墳|無處話淒涼|縱使相逢應不識|塵滿面|鬢如霜|夜來幽夢忽還鄉|小軒窗|正梳妝|相顧無言|惟有淚千行|料得年年腸斷處|明月夜|短松岡",
    "sushi:蝶戀花·春景": "花褪殘紅青杏小|燕子飛時|綠水人家繞|枝上柳綿吹又少|天涯何處無芳草|牆裡鞦韆牆外道|牆外行人|牆裡佳人笑|笑漸不聞聲漸悄|多情卻被無情惱",
    "sushi:花影": "重重疊疊上瑤臺|幾度呼童掃不開|剛被太陽收拾去|卻教明月送將來",
    "sushi:春宵": "春宵一刻值千金|花有清香月有陰|歌管樓臺聲細細|鞦韆院落夜沉沉",
    "sushi:浣溪沙": "山下蘭芽短浸溪|松間沙路淨無泥|蕭蕭暮雨子規啼|誰道人生無再少|門前流水尚能西|休將白髮唱黃雞",
    "sushi:卜算子·黃州定慧院寓居作": "缺月掛疏桐|漏斷人初靜|誰見幽人獨往來|縹緲孤鴻影|驚起卻回頭|有恨無人省|揀盡寒枝不肯棲|寂寞沙洲冷",

    "liqingzhao:如夢令·昨夜雨疏風驟": "昨夜雨疏風驟|濃睡不消殘酒|試問卷簾人|卻道海棠依舊|知否|知否|應是綠肥紅瘦",
    "liqingzhao:如夢令·常記溪亭日暮": "常記溪亭日暮|沉醉不知歸路|興盡晚回舟|誤入藕花深處|爭渡|爭渡|驚起一灘鷗鷺",
    "liqingzhao:一剪梅": "紅藕香殘玉簟秋|輕解羅裳|獨上蘭舟|雲中誰寄錦書來|雁字回時|月滿西樓|花自飄零水自流|一種相思|兩處閒愁|此情無計可消除|才下眉頭|卻上心頭",
    "liqingzhao:醉花陰": "薄霧濃雲愁永晝|瑞腦銷金獸|佳節又重陽|玉枕紗廚|半夜涼初透|東籬把酒黃昏後|有暗香盈袖|莫道不銷魂|簾卷西風|人比黃花瘦",
    "liqingzhao:夏日絕句": "生當作人傑|死亦為鬼雄|至今思項羽|不肯過江東",
    "liqingzhao:武陵春": "風住塵香花已盡|日晚倦梳頭|物是人非事事休|欲語淚先流|聞說雙溪春尚好|也擬泛輕舟|只恐雙溪舴艋舟|載不動許多愁",
    "liqingzhao:聲聲慢": "尋尋覓覓|冷冷清清|悽悽慘慘慼戚|乍暖還寒時候|最難將息|三杯兩盞淡酒|怎敵他|晚來風急|雁過也|正傷心|卻是舊時相識|滿地黃花堆積|憔悴損|如今有誰堪摘|守著窗兒|獨自怎生得黑|梧桐更兼細雨|到黃昏|點點滴滴|這次第|怎一個愁字了得",
    "liqingzhao:漁家傲": "天接雲濤連曉霧|星河欲轉千帆舞|彷彿夢魂歸帝所|聞天語|殷勤問我歸何處|我報路長嗟日暮|學詩謾有驚人句|九萬里風鵬正舉|風休住|蓬舟吹取三山去",
    "liqingzhao:蝶戀花·暖雨晴風初破凍": "暖雨晴風初破凍|柳眼梅腮|已覺春心動|酒意詩情誰與共|淚融殘粉花鈿重|乍試夾衫金縷縫|山枕斜欹|枕損釵頭鳳|獨抱濃愁無好夢|夜闌猶剪燈花弄",
    "liqingzhao:永遇樂·落日熔金": "落日熔金|暮雲合璧|人在何處|染柳煙濃|吹梅笛怨|春意知幾許|元宵佳節|融和天氣|次第豈無風雨|來相召|香車寶馬|謝他酒朋詩侶|中州盛日|閨門多暇|記得偏重三五|鋪翠冠兒|捻金雪柳|簇帶爭濟楚|如今憔悴|風鬟霜鬢|怕見夜間出去|不如向|簾兒底下|聽人笑語",
    "liqingzhao:點絳唇·蹴罷鞦韆": "蹴罷鞦韆|起來慵整纖纖手|露濃花瘦|薄汗輕衣透|見客入來|襪剗金釵溜|和羞走|倚門回首|卻把青梅嗅",
    "liqingzhao:減字木蘭花·賣花擔上": "賣花擔上|買得一枝春欲放|淚染輕勻|猶帶彤霞曉露痕|怕郎猜道|奴面不如花面好|雲鬢斜簪|徒要教郎比並看",
    "liqingzhao:鷓鴣天·桂花": "暗淡輕黃體性柔|情疏跡遠只香留|何須淺碧深紅色|自是花中第一流|梅定妒|菊應羞|畫闌開處冠中秋|騷人可煞無情思|何事當年不見收",
    "liqingzhao:清平樂·年年雪裡": "年年雪裡|常插梅花醉|挼盡梅花無好意|贏得滿衣清淚|今年海角天涯|蕭蕭兩鬢生華|看取晚來風勢|故應難看梅花",
    "liqingzhao:臨江仙·庭院深深深幾許": "庭院深深深幾許|雲窗霧閣春遲|為誰憔悴損芳姿|夜來清夢好|應是發南枝|玉瘦檀輕無限恨|南樓羌管休吹|濃香吹盡有誰知|暖風遲日也|別到杏花肥",

    "wangchangling:出塞·其一": "秦時明月漢時關|萬里長征人未還|但使龍城飛將在|不教胡馬度陰山",
    "wangchangling:出塞·其二": "騮馬新跨白玉鞍|戰罷沙場月色寒|城頭鐵鼓聲猶振|匣裡金刀血未乾",
    "wangchangling:芙蓉樓送辛漸": "寒雨連江夜入吳|平明送客楚山孤|洛陽親友如相問|一片冰心在玉壺",
    "wangchangling:從軍行·其四": "青海長雲暗雪山|孤城遙望玉門關|黃沙百戰穿金甲|不破樓蘭終不還",
    "wangchangling:從軍行·其七": "琵琶起舞換新聲|總是關山舊別情|撩亂邊愁聽不盡|高高秋月照長城",
    "wangchangling:採蓮曲": "荷葉羅裙一色裁|芙蓉向臉兩邊開|亂入池中看不見|聞歌始覺有人來",
    "wangchangling:閨怨": "閨中少婦不知愁|春日凝妝上翠樓|忽見陌頭楊柳色|悔教夫婿覓封侯",
    "wangchangling:長信怨": "奉帚平明金殿開|且將團扇共徘徊|玉顏不及寒鴉色|猶帶昭陽日影來",

    "wangchangling:春宮曲": "昨夜風開露井桃|未央前殿月輪高|平陽歌舞新承寵|簾外春寒賜錦袍",

    "wangchangling:送柴侍御": "沅水通波接武岡|送君不覺有離傷|青山一道同雲雨|明月何曾是兩鄉",
    "wangchangling:西宮春怨": "西宮夜靜百花香|欲卷珠簾春恨長|斜抱雲和深見月|朦朧樹色隱昭陽",
    "wangchangling:送魏二": "醉別江樓橘柚香|江風引雨入舟涼|憶君遙在瀟湘月|愁聽清猿夢裡長",
    "wangchangling:同從弟南齋玩月憶山陰崔少府": "高臥南齋時|開帷月初吐|清輝澹水木|演漾在窗戶|苒苒幾盈虛|澄澄變今古|美人清江畔|是夜越吟苦|千里共如何|微風吹蘭杜",

    "luyou:遊山西村": "莫笑農家臘酒渾|豐年留客足雞豚|山重水複疑無路|柳暗花明又一村|簫鼓追隨春社近|衣冠簡樸古風存|從今若許閒乘月|拄杖無時夜叩門",
    "luyou:示兒": "死去元知萬事空|但悲不見九州同|王師北定中原日|家祭無忘告乃翁",
    "luyou:冬夜讀書示子聿": "古人學問無遺力|少壯工夫老始成|紙上得來終覺淺|絕知此事要躬行",
    "luyou:臨安春雨初霽": "世味年來薄似紗|誰令騎馬客京華|小樓一夜聽春雨|深巷明朝賣杏花|矮紙斜行閒作草|晴窗細乳戲分茶|素衣莫起風塵嘆|猶及清明可到家",
    "luyou:卜算子·詠梅": "驛外斷橋邊|寂寞開無主|已是黃昏獨自愁|更著風和雨|無意苦爭春|一任群芳妒|零落成泥碾作塵|只有香如故",
    "luyou:病起書懷": "病骨支離紗帽寬|孤臣萬里客江干|位卑未敢忘憂國|事定猶須待闔棺|天地神靈扶廟社|京華父老望和鑾|出師一表通今古|夜半挑燈更細看",
    "luyou:十一月四日風雨大作": "僵臥孤村不自哀|尚思為國戍輪臺|夜闌臥聽風吹雨|鐵馬冰河入夢來",
    "luyou:書憤": "早歲那知世事艱|中原北望氣如山|樓船夜雪瓜洲渡|鐵馬秋風大散關|塞上長城空自許|鏡中衰鬢已先斑|出師一表真名世|千載誰堪伯仲間",
    "luyou:劍門道中遇微雨": "衣上征塵雜酒痕|遠遊無處不銷魂|此身合是詩人未|細雨騎驢入劍門",
    "luyou:梅花絕句": "聞道梅花坼曉風|雪堆遍滿四山中|何方可化身千億|一樹梅花一放翁",
    "luyou:秋夜將曉出籬門迎涼有感": "三萬裡河東入海|五千仞嶽上摩天|遺民淚盡胡塵裡|南望王師又一年",
    "luyou:沈園": "城上斜陽畫角哀|沈園非復舊池臺|傷心橋下春波綠|曾是驚鴻照影來",
    "luyou:訴衷情·當年萬里覓封侯": "當年萬里覓封侯|匹馬戍梁州|關河夢斷何處|塵暗舊貂裘|胡未滅|鬢先秋|淚空流|此生誰料|心在天山|身老滄洲",
    "luyou:釵頭鳳·紅酥手": "紅酥手|黃縢酒|滿城春色宮牆柳|東風惡|歡情薄|一懷愁緒|幾年離索|錯錯錯|春如舊|人空瘦|淚痕紅浥鮫綃透|桃花落|閒池閣|山盟雖在|錦書難託|莫莫莫",
    "luyou:讀書": "燈前目力雖非昔|猶課蠅頭二萬言|正使工夫時到處|天機濃淡自宜然"

    libai: { identity: "浪漫主義詩人", life: "李白字太白，號青蓮居士，被譽為「詩仙」。他少年任俠，遊歷四方，曾入翰林院供職，因不肯摧眉折腰而離開長安。一生足跡遍及大江南北，最終客死於安徽當塗。", style: "詩風豪放飄逸、想象奇絕，善用誇張與比喻，筆下常現月、酒、山川、劍俠等意象，氣勢磅礴，情感奔放。", works: "《靜夜思》《望廬山瀑布》《蜀道難》《將進酒》《行路難》" },

    baijuyi: { identity: "新樂府運動代表", life: "白居易字樂天，號香山居士。少年聰慧，二十九歲中進士。曾任翰林學士、江州司馬、杭州刺史等職。晚年退居洛陽，潛心念佛。他主張「文章合為時而著，歌詩合為事而作」。", style: "語言通俗易懂，老嫗能解；長於敘事抒情，題材廣泛，關心民間疾苦，也善寫閒適田園之作。", works: "《長恨歌》《琵琶行》《賦得古原草送別》《憶江南》《問劉十九》" },
    wangwei: { identity: "山水田園詩人", life: "王維字摩詰，號摩詰居士。少有才名，二十一歲中進士。曾任右拾遺、尚書右丞等職。安史之亂中被俘受偽職，亂後貶官。晚年篤信佛教，隱居藍田輞川。蘇軾讚其「詩中有畫，畫中有詩」。", style: "詩風清幽淡遠，善於描繪自然景物，意境空靈。精於繪畫與音樂，詩中常帶畫意與禪趣。", works: "《山居秋暝》《使至塞上》《九月九日憶山東兄弟》《送元二使安西》《鳥鳴澗》" },
    sushi: { identity: "豪放詞人", life: "蘇軾字子瞻，號東坡居士。二十一歲中進士，曾任禮部尚書等職。因反對王安石變法屢遭貶謫，先後被責至黃州、惠州、儋州。他才華橫溢，詩、詞、文、書、畫皆為大家。", style: "詞風開創豪放一派，氣象宏闊，意境深遠。也擅長婉約，情感細膩。文風曠達灑脫，常寄託人生哲理。", works: "《水調歌頭》《念奴嬌·赤壁懷古》《題西林壁》《定風波》《飲湖上初晴後雨》" },
    liqingzhao: { identity: "婉約詞人", life: "李清照號易安居士。出身書香門第，早年與夫趙明誠志趣相投，收藏金石字畫。靖康之難後流寓南方，丈夫病逝，晚年孤苦。她是中國文學史上最傑出的女詞人。", style: "前期詞風清麗婉約，寫閨閣生活與相思之情；後期沉鬱悲涼，寄託家國之痛與身世之感。語言精煉，善用白描。", works: "《如夢令》《聲聲慢》《一剪梅》《醉花陰》《夏日絕句》" },
    wangchangling: { identity: "邊塞詩人", life: "王昌齡字少伯，被譽為「七絕聖手」。進士出身，曾任江寧丞、龍標尉等職。安史之亂中遇害。他與李白、王維等人交好，詩作以邊塞題材最為著名。", style: "七言絕句尤為精妙，邊塞詩雄健高昂、慷慨激昂；閨怨宮怨詩含蓄婉轉，意境深遠。", works: "《出塞》《芙蓉樓送辛漸》《從軍行》《閨怨》" },
    luyou: { identity: "愛國詩人", life: "陸游字務觀，號放翁。南宋著名愛國詩人。進士出身，曾任禮部郎中等職。他一生力主抗金，屢遭投降派排擠，壯志難酬。晚年退居山陰鄉間，仍念念不忘收復中原。", style: "詩風雄渾豪壯，愛國情懷貫穿一生。也善寫田園風光與日常生活，情感真切深沉。", works: "《遊山西村》《示兒》《十一月四日風雨大作》《卜算子·詠梅》《書憤》" },
    caocao: { identity: "政治家、軍事家、詩人", life: "曹操字孟德，東漢末年權臣。出身宦官家庭，起兵討伐董卓，統一北方，為曹魏奠基。他文武雙全，兼擅詩歌，是「建安文學」的領袖人物。", style: "詩風蒼涼雄健，氣魄宏大。善於將個人抱負與社會現實相結合，語言質樸有力。", works: "《短歌行》《觀滄海》《龜雖壽》" },
    taoyuanming: { identity: "田園詩宗", life: "陶淵明名潛，字元亮，號五柳先生。曾任彭澤令，因不願「為五斗米折腰」而辭官歸隱。此後躬耕田園，安貧樂道，被後世尊為「隱逸詩人之宗」。", style: "田園詩開創者，語言自然質樸，意境清新淡遠。詩中寄託了對自由與純真生活的嚮往。", works: "《飲酒》《歸園田居》《桃花源記》《五柳先生傳》" },
    wangbo: { identity: "初唐四傑之首", life: "王勃字子安，絕世才子。少年即有文名，被譽為「初唐四傑」之一。曾任虢州參軍，因殺官奴獲罪連累父親。渡海探父時溺水驚悸而卒，年僅二十七歲。", style: "詩文辭藻華麗，格律工整，對唐詩發展有重要影響。駢文尤為出色，《滕王閣序》千古傳頌。", works: "《送杜少府之任蜀州》《滕王閣詩》《滕王閣序》" },
    chenziang: { identity: "詩歌革新先驅", life: "陳子昂字伯玉。少年任俠，後發憤讀書。二十四歲中進士，曾任右拾遺。後隨武攸宜出征契丹，屢次進言不被採納，辭官回鄉，被縣令迫害致死。", style: "力倡「漢魏風骨」，反對齊梁綺靡之風。詩風蒼勁開闊，意境悲涼壯闊。", works: "《登幽州臺歌》" },
    wangwan: { identity: "盛唐詩人", life: "王灣，洛陽人。先天年間進士及第，官至洛陽尉。其詩流傳不多，但《次北固山下》一首便足以名垂千古，被殷璠收入《河嶽英靈集》。", style: "詩風清新自然，善於在行旅中寫景抒情，意境渾然天成。", works: "《次北固山下》" },
    cuihao: { identity: "盛唐詩人", life: "崔顥，汴州人。開元年間進士，曾任司勳員外郎。早年詩風浮豔，後遊歷邊塞，詩風大變。他最著名的《黃鶴樓》據傳令李白擱筆嘆服。", style: "七律名篇氣象高遠，格律嚴謹，情景交融，被嚴羽譽為唐人七律第一。", works: "《黃鶴樓》" },
    censhen: { identity: "邊塞詩人", life: "岑參，南陽人。天寶年間進士。曾任安西節度使幕府掌書記等職，兩度出塞。他是盛唐最傑出的邊塞詩人之一，與高適並稱「高岑」。", style: "邊塞詩奇麗雄健，善用誇張比喻描繪西域壯美風光與軍旅生活，色彩濃烈，氣勢磅礴。", works: "《白雪歌送武判官歸京》《逢入京使》" },
    liuyuxi: { identity: "中唐詩人", life: "劉禹錫字夢得，洛陽人。貞元年間進士。因參與「永貞革新」失敗，連遭貶謫二十餘年。雖屢遭打擊，始終保持樂觀豁達的態度，有「詩豪」之稱。", style: "詩風豪健明朗，善用比興手法，哲理詩意趣橫生。也工於詞，對詞的發展有貢獻。", works: "《秋詞》《酬樂天揚州初逢席上見贈》《望洞庭》" },
    dumu: { identity: "晚唐詩人", life: "杜牧字牧之，京兆萬年人。出身名門，宰相杜佑之孫。大和年間進士，曾任黃州、池州等刺史。他在晚唐詩壇與李商隱齊名，並稱「小李杜」。", style: "詩風俊爽清麗，絕句尤為精妙。善於將歷史感嘆與現實感悟融為一體，懷古詩深沉動人。", works: "《山行》《清明》《泊秦淮》《赤壁》" },
    lishangyin: { identity: "晚唐詩人", life: "李商隱字義山，號玉谿生。早年受牛黨令狐楚賞識，後娶李黨王茂元之女，捲入黨爭，一生受壓抑。曾任秘書省校書郎等低級官職。", style: "詩風綺麗幽深，善用典故，意象朦朧含蓄。無題詩尤為著名，情感纏綿悱惻，意蘊豐富多義。", works: "《錦瑟》《無題》《夜雨寄北》" },
    xinqiji: { identity: "豪放詞人", life: "辛棄疾字幼安，號稼軒。山東濟南人。青年時曾參加抗金義軍，後南歸宋朝。曾任多地知州等職，但始終未被重用，壯志難酬。他是南宋最傑出的詞人。", style: "詞風豪放雄渾，以文為詞，題材廣泛。善於抒發愛國激情與壯志難酬的悲憤，筆力雄健。", works: "《破陣子》《永遇樂·京口北固亭懷古》《青玉案·元夕》《南鄉子》" },
    wentianxiang: { identity: "民族英雄、詩人", life: "文天祥字宋瑞，號文山。吉州廬陵人。寶祐年間狀元。元軍南下時，他散盡家財起兵勤王。兵敗被俘，囚禁三年，堅決不降，英勇就義。", style: "詩文氣勢磅礴，慷慨悲壯。充滿民族氣節與浩然正氣，文字有力，感人至深。", works: "《過零丁洋》《正氣歌》" },
    mazhiyuan: { identity: "元曲大家", life: "馬致遠號東籬，大都人。元代著名雜劇作家、散曲家。曾任江浙行省務官。晚年退隱田園，與關漢卿、白樸、鄭光祖並稱「元曲四大家」。", style: "散曲語言精煉，意境蒼涼蕭瑟。善於借景抒情，將個人身世之感融入自然景物之中。", works: "《天淨沙·秋思》《漢宮秋》" },
    gongzizhen: { identity: "近代啟蒙思想家", life: "龔自珍字璱人，號定盦。浙江仁和人。道光年間進士。曾任內閣中書等職。他是晚清思想解放的先驅，主張變革圖強，對後世影響深遠。", style: "詩文富有批判精神與改革氣息，構思奇特，想象豐富，語言瑰麗，開創一代新風。", works: "《己亥雜詩》" },
    hanyu: { identity: "唐宋八大家之首", life: "韓愈字退之，河陽人。貞元年間進士。曾任吏部侍郎等職。他倡導「古文運動」，反對駢文，提倡散體文。被貶潮州刺史時寫下名篇。", style: "詩風雄健奇崛，以文為詩，追求創新。散文更是成就卓著，被尊為「唐宋八大家」之首。", works: "《早春呈水部張十八員外》《左遷至藍關示侄孫湘》《師說》" },
    liuzongyuan: { identity: "唐宋八大家之一", life: "柳宗元字子厚，河東人。貞元年間進士。參與「永貞革新」失敗後被貶為永州司馬，後遷柳州刺史。在貶謫生涯中創作了大量優秀散文和詩歌。", style: "詩風清峻淡遠，善於以自然景物寄託政治感慨與身世之悲。山水遊記尤為出色。", works: "《江雪》《漁翁》《登柳州城樓寄漳汀封連四州》《小石潭記》" }
  };

    if (normalizedIndexes.length <= 2) return new Set([normalizedIndexes.at(-1)?.index].filter(index => index !== undefined));

    const positions = normalizedIndexes
      .filter((item, index) => (index + lineIndex + 1) % interval === 0)
      .map(item => item.index);
    if (!positions.length) positions.push(normalizedIndexes[Math.floor(normalizedIndexes.length / 2)].index);
    return new Set(positions.slice(0, Math.max(1, Math.ceil(normalizedIndexes.length / 5))));
  }

  function diffCharacters(expected, actual) {
    const a = Array.from(expected);
    const b = Array.from(actual);
    const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));

    for (let i = 0; i <= a.length; i++) dp[i][0] = i;
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;

    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const replaceCost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + replaceCost
        );
      }
    }

    const ops = [];
    let i = a.length;
    let j = b.length;

    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1] && dp[i][j] === dp[i - 1][j - 1]) {
        ops.push({ type: "equal", expected: a[i - 1], actual: b[j - 1] });
        i--;
        j--;
      } else if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) {
        ops.push({ type: "replace", expected: a[i - 1], actual: b[j - 1] });
        i--;
        j--;
      } else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) {
        ops.push({ type: "delete", expected: a[i - 1], actual: "" });
        i--;
      } else {
        ops.push({ type: "insert", expected: "", actual: b[j - 1] });
        j--;
      }
    }

    return ops.reverse();
  }

  function scoreAnswer(userAnswer, poem, lines = poem.lines) {
    const expected = normalizeAnswer(poemText(poem, lines));
    const actual = normalizeAnswer(userAnswer);
    const ops = diffCharacters(expected, actual);
    const statuses = [];
    const issues = [];
    const extras = [];
    let expectedIndex = 0;
    let distance = 0;

    ops.forEach(op => {
      if (op.type === "insert") {
        distance += 1;
        extras.push({ actual: op.actual, position: expectedIndex + 1 });
        issues.push({ type: "insert", actual: op.actual, position: expectedIndex + 1 });
        return;
      }

      expectedIndex += 1;

      if (op.type === "equal") {
        statuses.push({ type: "correct", expected: op.expected, actual: op.actual });
        return;
      }

      distance += 1;
      statuses.push({ type: op.type, expected: op.expected, actual: op.actual });
      issues.push({ type: op.type, expected: op.expected, actual: op.actual, position: expectedIndex });
    });

    const percent = expected.length ? Math.max(0, Math.round((1 - distance / expected.length) * 100)) : 0;
    const lineMatches = lines.filter(line => actual.includes(normalizeAnswer(line))).length;

    return {
      correct: distance === 0,
      matched: lineMatches,
      total: lines.length,
      percent,
      distance,
      issues,
      extras,
      statuses,
      lines,
      metricLabel: "行數命中"
    };
  }

    return [
      facts.period,
      facts.courtesy ? `字${facts.courtesy}` : "",
      facts.sobriquet ? `號${facts.sobriquet}` : "",
      facts.known
    ].filter(Boolean).join(" · ");
  }

  function stableHash(value) {
    return Array.from(String(value)).reduce((hash, char) => ((hash * 31) + char.charCodeAt(0)) >>> 0, 2166136261);
  }

  function optionSet(correct, pool, seed) {
    const unique = pool.filter(Boolean).filter((item, index, items) => item !== correct && items.indexOf(item) === index);
    return [correct, ...unique
      .sort((a, b) => stableHash(`${seed}:${a}`) - stableHash(`${seed}:${b}`))
      .slice(0, 3)]
      .sort((a, b) => stableHash(`${seed}:final:${a}`) - stableHash(`${seed}:final:${b}`));
  }

  function cultureQuestions() {
    const availablePoets = getAvailablePoets().filter(poet => poetBio[poet.id]);
    const knownPool = poets.map(poet => poetFacts[poet.id]?.known).filter(Boolean);
    const workPool = poets.flatMap(poet => getPoetWorks(poet.id).slice(0, 2));

    return availablePoets.flatMap(poet => {
      const bio = poetBio[poet.id];
      const facts = poetFacts[poet.id] || {};
      const works = getPoetWorks(poet.id);
      const firstWork = works[0] || poet.poems[0]?.title || "";
      const questions = [];

      if (firstWork) {
        questions.push({
          id: `${poet.id}-work-choice`,
          type: "choice",
          poetId: poet.id,
          poetName: poet.name,
          prompt: `下列哪一部作品屬於${poet.name}？`,
          answer: firstWork,
          options: optionSet(firstWork, workPool.filter(work => !works.includes(work)), `${poet.id}-work`),
          note: `${poet.name}的代表作包括：${bio.works}。`
        });
      }

      if (facts.known) {
        questions.push({
          id: `${poet.id}-known-choice`,
          type: "choice",
          poetId: poet.id,
          poetName: poet.name,
          prompt: `下列哪一項文化常識與${poet.name}相符？`,
          answer: facts.known,
          options: optionSet(facts.known, knownPool.filter(item => item !== facts.known), `${poet.id}-known`),
          note: `${poet.name}常識：${getPoetFactSummary(poet)}。`
        });
      }

      if (facts.courtesy || facts.sobriquet) {
        const label = facts.courtesy ? "字" : "號";
        const answer = facts.courtesy || facts.sobriquet;
        questions.push({
          id: `${poet.id}-name-blank`,
          type: "blank",
          poetId: poet.id,
          poetName: poet.name,
          prompt: `${poet.name}，${label} ______。`,
          answer,
          note: `${poet.name}${facts.courtesy ? `字${facts.courtesy}` : ""}${facts.sobriquet ? `，號${facts.sobriquet}` : ""}${facts.known ? `，常稱「${facts.known}」` : ""}。`
        });
      }

      if (firstWork) {
        questions.push({
          id: `${poet.id}-work-blank`,
          type: "blank",
          poetId: poet.id,
          poetName: poet.name,
          prompt: `${poet.name}的代表作之一是《______》。`,
          answer: firstWork,
          note: `${poet.name}的代表作包括：${bio.works}。`
        });
      }

      return questions;
    });
  }

  const reviewIntervals = [1, 3, 7, 15];
  const dayMs = 24 * 60 * 60 * 1000;

  function daysSince(timestamp) {
    if (!timestamp) return Infinity;
    return Math.max(0, Math.floor((Date.now() - timestamp) / dayMs));
  }

  function recordReview(poem) {
    if (!poem?.id) return;
    const previous = stats.reviewRecords[poem.id] || {};
    stats.reviewRecords[poem.id] = {
      lastReviewed: Date.now(),
      reviewCount: (previous.reviewCount || 0) + 1
    };
  }

  function getWrongWeight(poemId) {
    const item = wrongs.find(wrong => wrong.id === poemId);
    if (!item) return 0;
    return Math.min(3, (item.misses || 1) + Math.ceil((item.issueCount || 0) / 2));
  }

  function getReviewItems() {
    const currentGradePoems = getGradePoems();
    const masteredSet = new Set(stats.masteredIds);
    return currentGradePoems.map(poem => {
      const record = stats.reviewRecords[poem.id] || {};
      const reviewCount = Math.max(0, record.reviewCount || 0);
      const intervalIndex = Math.min(Math.max(reviewCount - 1, 0), reviewIntervals.length - 1);
      const targetDays = reviewIntervals[intervalIndex];
      const elapsedDays = record.lastReviewed ? daysSince(record.lastReviewed) : (masteredSet.has(poem.id) ? reviewIntervals[0] : 0);
      const wrongWeight = getWrongWeight(poem.id);
      const isDue = masteredSet.has(poem.id) && elapsedDays >= targetDays;
      const shouldShow = isDue || wrongWeight > 0;
      const score = (isDue ? elapsedDays / Math.max(1, targetDays) : 0) + wrongWeight * 0.65 + (masteredSet.has(poem.id) ? 0.25 : 0);
      return {
        poem,
        record,
        targetDays,
        elapsedDays,
        wrongWeight,
        isDue,
        shouldShow,
        score
      };
    }).filter(item => item.shouldShow).sort((a, b) => b.score - a.score);
  }

  function getSmartReviewLead() {
    const due = getReviewItems()[0];
    if (due) return due;
    const masteredSet = new Set(stats.masteredIds);
    const fallbackPoem = getGradePoems().find(poem => !masteredSet.has(poem.id)) || getCurrentPoem();
    return {
      poem: fallbackPoem,
      record: stats.reviewRecords[fallbackPoem.id] || {},
      targetDays: reviewIntervals[0],
      elapsedDays: 0,
      wrongWeight: 0,
      isDue: false,
      shouldShow: false,
      score: 0
    };
  }

  const bgMusic = {
    ctx: null,
    gain: null,
    playing: false,
    volume: 0.3,
    currentPoetId: null,
    melodyTimer: null,
    progressTimer: null,
    melodyDuration: 0,
    melodyStartTime: 0,

    init() {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.gain = this.ctx.createGain();
        this.gain.gain.value = this.volume * 0.15;
        this.gain.connect(this.ctx.destination);
      } catch (e) { /* AudioContext not supported */ }
    },

    ensureCtx() {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    },

    playNote(freq, duration, delay) {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const noteGain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      noteGain.gain.setValueAtTime(0, this.ctx.currentTime + delay);
      noteGain.gain.linearRampToValueAtTime(1, this.ctx.currentTime + delay + 0.08);
      noteGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + delay + duration);
      osc.connect(noteGain);
      noteGain.connect(this.gain);
      osc.start(this.ctx.currentTime + delay);
      osc.stop(this.ctx.currentTime + delay + duration);
    },

    playMelody(poetId) {
      this.ensureCtx();
      this.stopMelody();
      this.currentPoetId = poetId;

      const info = poetMusic[poetId] || poetMusic.libai;
      const label = document.getElementById("musicLabel");
      if (label) label.textContent = info.name;

      const playSequence = () => {
        if (!this.playing || this.currentPoetId !== poetId) return;
        const noteCount = 8 + Math.floor(Math.random() * 8);
        let t = 0;
        for (let i = 0; i < noteCount; i++) {
          const semitone = info.scale[Math.floor(Math.random() * info.scale.length)];
          const freq = info.baseFreq * Math.pow(2, semitone / 12);
          const dur = 0.8 + Math.random() * 1.2;
          this.playNote(freq, dur, t);
          t += dur * 0.7 + Math.random() * 0.5;
        }
        this.melodyDuration = t;
        this.melodyStartTime = Date.now();
        this.startProgress(t * 1000);
        this.melodyTimer = setTimeout(playSequence, t * 1000 + 200);
      };

      playSequence();
    },

    startProgress(totalMs) {
      this.stopProgress();
      const fill = document.getElementById("musicProgressFill");
      if (!fill) return;
      fill.classList.add("animating");
      const tick = () => {
        const elapsed = Date.now() - this.melodyStartTime;
        const pct = Math.min(100, (elapsed / totalMs) * 100);
        fill.style.width = pct + "%";
        if (pct < 100 && this.playing) {
          this.progressTimer = requestAnimationFrame(tick);
        }
      };
      this.progressTimer = requestAnimationFrame(tick);
    },

    stopProgress() {
      cancelAnimationFrame(this.progressTimer);
      this.progressTimer = null;
      const fill = document.getElementById("musicProgressFill");
      if (fill) {
        fill.classList.remove("animating");
        fill.style.width = "0%";
      }
    },

    stopMelody() {
      clearTimeout(this.melodyTimer);
      this.melodyTimer = null;
      this.stopProgress();
    },

    toggle() {
      this.ensureCtx();
      this.playing = !this.playing;
      const btn = document.getElementById("musicToggle");
      if (btn) btn.textContent = this.playing ? "⏸" : "▶";
      if (this.playing) {
        this.playMelody(this.currentPoetId || state.poetId);
      } else {
        this.stopMelody();
      }
    },

    switchPoet(poetId) {
      this.playing = true;
      const btn = document.getElementById("musicToggle");
      if (btn) btn.textContent = "⏸";
      this.playMelody(poetId);
    },

    show() {
      document.getElementById("musicPlayer")?.classList.remove("hidden");
    },

    hide() {
      document.getElementById("musicPlayer")?.classList.add("hidden");
    }
  };

    let filteredPoems = getFilteredPoems(poet);

      const nextPoet = availablePoets.find(item => getFilteredPoems(item).length);
      if (nextPoet) {
        state.poetId = nextPoet.id;

        filteredPoems = getFilteredPoems(poet);
      } else {
        state.difficulty = "all";
        filteredPoems = getFilteredPoems(poet);
      }
    }
    if (!filteredPoems.some(poem => poem.id === state.currentPoemId)) {
      state.currentPoemId = filteredPoems[0]?.id || poet.poems[0].id;
    }
    const poem = getCurrentPoem();
    state.studyStep = Math.min(Math.max(1, state.studyStep || 1), poem.lines.length);
    if (state.practiceMode === "full") state.studyStep = poem.lines.length;
    const targetLines = getTargetLines(poem);
    const poemLevel = getPoemLevel(poem);
    const stageLabel = practiceStageLabel(poem, targetLines);
    const instruction = state.practiceMode === "blank"
      ? "先補齊缺字，建立句子記憶，再進入整句默寫。"
      : state.practiceMode === "full"
        ? "現在挑戰整首默寫，不用輸入標點也可以。"
        : "先默寫目前解鎖的句子，通關後會自動增加下一句。";
    const masteredSet = new Set(stats.masteredIds);
    const gradeIds = new Set(getGradePoemIds());
    const gradePoems = getGradePoems();
    const visibleGradePoems = state.difficulty === "all" ? gradePoems : gradePoems.filter(item => getPoemLevel(item) === state.difficulty);
    const visiblePoets = availablePoets.filter(item => {
      const itemGradePoems = gradeIds.size ? item.poems.filter(poemItem => gradeIds.has(poemItem.id)) : item.poems;
      const itemVisiblePoems = state.difficulty === "all" ? itemGradePoems : itemGradePoems.filter(poemItem => getPoemLevel(poemItem) === state.difficulty);
      return itemVisiblePoems.length > 0;

  function editDistance(a, b) {
    const prev = Array.from({ length: b.length + 1 }, (_, index) => index);
    const curr = new Array(b.length + 1);
    for (let i = 1; i <= a.length; i++) {
      curr[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
      }
      for (let j = 0; j <= b.length; j++) prev[j] = curr[j];
    }
    return prev[b.length];
  }

  function textSimilarity(a, b) {
    if (!a && !b) return 1;
    const length = Math.max(a.length, b.length);
    if (!length) return 0;
    return Math.max(0, 1 - editDistance(a, b) / length);
  }

  function phoneticNormalize(value) {
    return Array.from(voiceTextNormalize(value)).map(voiceCanonicalChar).join("");
  }

  function voiceTextNormalize(value) {
    return Array.from(normalizeAnswer(value)).map(char => voiceVariantMap[char] || char).join("");
  }

  function voiceCanonicalChar(char) {
    const unified = voiceVariantMap[char] || char;
    return voiceHomophoneMap[unified] || unified;
  }

  function isSameOrHomophone(actualChar, expectedChar) {
    const actual = voiceVariantMap[actualChar] || actualChar;
    const expected = voiceVariantMap[expectedChar] || expectedChar;
    return actual === expected || voiceCanonicalChar(actual) === voiceCanonicalChar(expected);
  }

  function sameLengthHomophonePass(actual, expected) {
    if (actual.length !== expected.length || !actual.length) return false;
    return Array.from(actual).every((char, index) => isSameOrHomophone(char, expected[index]));
  }

  function voiceHomophoneDetails(transcript, targetText) {
    const actual = voiceTextNormalize(transcript);
    const expected = voiceTextNormalize(targetText);
    if (!actual || !expected) return [];
    const length = Math.min(actual.length, expected.length);
    const details = [];
    for (let i = 0; i < length; i++) {
      if (actual[i] === expected[i]) continue;
      if (isSameOrHomophone(actual[i], expected[i])) {
        details.push(`「${actual[i]}」按「${expected[i]}」通過`);
      }
    }
    return Array.from(new Set(details)).slice(0, 8);
  }

  function voiceMatchScore(transcript, targetText) {
    const actual = voiceTextNormalize(transcript);
    const expected = voiceTextNormalize(targetText);
    if (!actual || !expected) return 0;
    if (actual.includes(expected)) return 1;
    if (sameLengthHomophonePass(actual, expected)) return 1;
    if (expected.includes(actual) && actual.length >= Math.ceil(expected.length * 0.82)) return 0.92;

    const baseScore = textSimilarity(actual, expected);
    const phoneticScore = textSimilarity(phoneticNormalize(actual), phoneticNormalize(expected));
    const expectedChars = Array.from(new Set(Array.from(expected)));
    const actualSound = phoneticNormalize(actual);
    const coreCoverage = expectedChars.length
      ? expectedChars.filter(char => actual.includes(char) || actualSound.includes(voiceHomophoneMap[char] || char)).length / expectedChars.length
      : 0;

    return Math.max(baseScore, phoneticScore, coreCoverage >= 0.8 ? 0.84 : coreCoverage * 0.72);
  }

  function voiceErrorMessage(error) {
    if (error === "not-allowed" || error === "service-not-allowed") return "瀏覽器未取得麥克風權限，請允許後再試。";
    if (error === "audio-capture") return "暫時找不到麥克風，請檢查裝置後再試。";
    if (error === "no-speech") return "這次沒有聽清楚，可以再按一次重新背誦。";
    return "語音識別暫時沒有成功，請再試一次，或直接手動輸入。";
  }

  function toggleVoiceInput() {
    if (state.voiceListening) {
      stopVoiceRecognition(true);
      render();
      return;
    }

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      state.voiceStatus = "這個瀏覽器暫不支援語音識別；可以改用 Chrome 或 Edge，或直接手動輸入。";
      render();
      return;
    }

    const poem = getCurrentPoem();
    const targetLines = getTargetLines(poem);
    const targetText = targetLines.join("");
    speechRecognition = new Recognition();
    speechRecognition.lang = "zh-HK";
    speechRecognition.continuous = false;
    speechRecognition.interimResults = true;
    speechRecognition.maxAlternatives = 5;

    state.voiceListening = true;
    state.voiceStatus = "正在聆聽你的背誦；系統只做即時判定，不保存錄音。";
    render();

    speechRecognition.onresult = event => {
      let bestTranscript = "";
      let bestScore = 0;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        Array.from(event.results[i]).forEach(alternative => {
          const transcript = alternative.transcript || "";
          const score = voiceMatchScore(transcript, targetText);
          if (score > bestScore) {
            bestScore = score;
            bestTranscript = transcript;
          }
        });
      }

      if (!bestTranscript) return;
      const percent = Math.round(bestScore * 100);
      updateVoiceStatus(`聽到：「${bestTranscript.trim()}」；相似度 ${percent}%。同音字會按讀音接近輔助判定。`);

      if (bestScore >= 0.8) {
        fillAnswerFromVoice(poem, targetLines);
        state.voiceListening = false;
        const homophones = voiceHomophoneDetails(bestTranscript, targetText);
        const note = homophones.length
          ? `同音容錯：${homophones.join("、")}。`
          : `沒有發現需要標出的同音錯字。`;
        stopVoiceRecognition(false);
        updateVoiceStatus(`聽到：「${bestTranscript.trim()}」；判定通過。${note} 系統會停留 3 秒讓你查看，然後自動提交。`);
        voiceSubmitTimer = setTimeout(() => {
          voiceSubmitTimer = null;
          checkAnswer();
        }, 3000);
      }
    };

    speechRecognition.onerror = event => {
      speechRecognition = null;
      state.voiceListening = false;
      updateVoiceStatus(voiceErrorMessage(event.error), true);
    };

    speechRecognition.onend = () => {
      speechRecognition = null;
      if (!state.voiceListening) return;
      state.voiceListening = false;
      updateVoiceStatus("錄音已結束。若尚未過關，請再按一次語音輸入或手動提交。", true);
    };

    try {
      speechRecognition.start();
    } catch (error) {
      speechRecognition = null;
      state.voiceListening = false;
      state.voiceStatus = "語音識別啟動失敗，請稍後再試。";
      render();
    }
  }

  function scoreCloze(poem, lines) {
    const inputs = Array.from(document.querySelectorAll(".blank-input"));
    const blanks = inputs.map((input, index) => {
      const expected = input.dataset.expected || "";
      const actual = input.value.trim();
      return {
        expected,
        actual,
        position: index + 1,
        correct: normalizeAnswer(actual) === normalizeAnswer(expected)
      };
    });
    const matched = blanks.filter(item => item.correct).length;
    const percent = blanks.length ? Math.round((matched / blanks.length) * 100) : 0;
    const issues = blanks
      .filter(item => !item.correct)
      .map(item => ({ type: item.actual ? "replace" : "delete", expected: item.expected, actual: item.actual || "空", position: item.position }));
    return {
      correct: blanks.length > 0 && matched === blanks.length,
      matched,
      total: blanks.length,
      percent,
      distance: issues.length,
      issues,
      extras: [],
      statuses: [],
      lines,
      blanks,
      metricLabel: "填空命中"
    };
  }

  function completePracticeSuccess(poem, score) {
    const level = getPoemLevel(poem);
    stats.correct += 1;
    stats.streak += 1;
    stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
    stats.correctByDifficulty[level] = (stats.correctByDifficulty[level] || 0) + 1;
    stats.correctByMode[state.practiceMode] = (stats.correctByMode[state.practiceMode] || 0) + 1;
    wrongs = wrongs.filter(item => item.id !== poem.id);

    const fullPassed = state.practiceMode === "full" || (state.practiceMode === "line" && score.lines.length === poem.lines.length);
    const completedBlankReview = state.practiceMode === "blank" && state.studyStep >= poem.lines.length;
    if (fullPassed || completedBlankReview) recordReview(poem);

    const earnedEnergy = addEnergyPoints(poem, score);

    if (fullPassed) {
      if (!stats.masteredIds.includes(poem.id)) stats.masteredIds.push(poem.id);
      state.feedback = scoreResultHTML(score, poem);
      state.feedbackType = "good";
      state.answerVisible = false;
      if (earnedEnergy > 0) state.feedback += `<div style="text-align:center;margin-top:8px;color:var(--gold);font-weight:700;">⚡ +${earnedEnergy} 能量</div>`;
      showNewAchievements();
      checkStarReward();
      return;
    }

    if (state.studyStep < poem.lines.length) {
      state.studyStep += 1;
      state.feedback = `<div class="score-card"><div class="score-orb" style="--score-angle:360deg"><strong>✓</strong></div><div class="score-copy"><h4>🎉 本關通過</h4><p>已解鎖下一句，現在進入 ${practiceStageLabel(poem, getTargetLines(poem))}。</p>${earnedEnergy > 0 ? `<p style="color:var(--gold);font-weight:700;">⚡ +${earnedEnergy} 能量</p>` : ""}</div></div>`;
      state.feedbackType = "good";
      state.blankResult = null;
      state.answerVisible = false;
      checkStarReward();
      return;
    }

    state.practiceMode = "full";
    state.studyStep = poem.lines.length;
    state.feedback = `<div class="score-card"><div class="score-orb" style="--score-angle:360deg"><strong>✓</strong></div><div class="score-copy"><h4>✨ 輔助訓練完成</h4><p>填空已完成，最後用整首默寫確認長期記憶。</p>${earnedEnergy > 0 ? `<p style="color:var(--gold);font-weight:700;">⚡ +${earnedEnergy} 能量</p>` : ""}</div></div>`;
    state.feedbackType = "good";
    state.blankResult = null;
    state.answerVisible = false;
    checkStarReward();
  }

  function checkAnswer() {
    const poem = getCurrentPoem();
    const targetLines = getTargetLines(poem);
    const input = document.getElementById("answerInput");
    const answer = input?.value.trim() || "";
    if (state.practiceMode !== "blank" && !answer) return;

    const score = state.practiceMode === "blank" ? scoreCloze(poem, targetLines) : scoreAnswer(answer, poem, targetLines);
    const correct = score.correct;
    stats.attempts += 1;
    stats.poetAttempts[poem.poetId] = (stats.poetAttempts[poem.poetId] || 0) + 1;

    if (correct) {
      completePracticeSuccess(poem, score);
    } else {
      stats.streak = 0;
      addWrong(poem, answer, score);
      state.feedback = scoreResultHTML(score, poem);
      state.feedbackType = "bad";
      state.answerVisible = false;
      state.blankResult = score.blanks || null;
    }

    saveProgress();
    render();
  }

  function addWrong(poem, userAnswer, score) {
    const existing = wrongs.find(item => item.id === poem.id);
    if (existing) {
      existing.misses += 1;
      existing.lastAnswer = userAnswer;
      existing.lastScore = score.percent;
      existing.issueCount = score.issues.length;
      existing.updatedAt = Date.now();
      return;
    }
    wrongs.unshift({
      id: poem.id,
      poetId: poem.poetId,
      title: poem.title,
      lines: poem.lines,
      difficulty: getPoemLevel(poem),
      misses: 1,
      lastAnswer: userAnswer,
      lastScore: score.percent,
      issueCount: score.issues.length,
      updatedAt: Date.now()
    });
  }

    const list = getFilteredPoems();
    if (!list.length) return;
    const currentIndex = Math.max(0, list.findIndex(poem => poem.id === state.currentPoemId));
    state.currentPoemId = list[(currentIndex + 1) % list.length].id;
    resetPracticeFlow();
    render();

  function bindCultureEvents() {
    appView.querySelectorAll("[data-culture-mode]").forEach(button => {

        resetCultureResult();
        render();
      });
    });

    appView.querySelectorAll("[data-culture-poet]").forEach(button => {
      button.addEventListener("click", () => {
        const questions = filteredCultureQuestions();
        const index = questions.findIndex(question => question.poetId === button.dataset.culturePoet);
        if (index >= 0) state.cultureQuestionIndex = index;
        resetCultureResult();
        render();
      });
    });

    appView.querySelectorAll("[data-culture-choice]").forEach(button => {
      button.addEventListener("click", () => {
        const question = getCurrentCultureQuestion();
        if (!question) return;
        const answer = button.dataset.cultureChoice;
        state.cultureResult = {
          id: question.id,
          answer,
          correct: normalizeAnswer(answer) === normalizeAnswer(question.answer)
        };
        render();
      });
    });

    appView.querySelector("[data-action='submit-culture']")?.addEventListener("click", checkCultureBlank);
    appView.querySelector("#cultureInput")?.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        checkCultureBlank();
      }
    });

    appView.querySelector("[data-action='next-culture']")?.addEventListener("click", () => {
      const questions = filteredCultureQuestions();
      state.cultureQuestionIndex = questions.length ? (state.cultureQuestionIndex + 1) % questions.length : 0;
      resetCultureResult();
      render();
    });

    appView.querySelector("[data-action='show-culture']")?.addEventListener("click", () => {
      const question = getCurrentCultureQuestion();
      if (!question) return;
      state.cultureResult = { id: question.id, answer: question.answer, correct: true };
      render();
    });
  }

  function checkCultureBlank() {

      correct: normalizeAnswer(answer) === normalizeAnswer(question.answer)

  function getUnlockedAchievements() {

  function achievementPercent(item) {
    if (!item.target) return item.unlocked ? 100 : 0;
    return Math.min(100, Math.round((item.progress / item.target) * 100));
  }

  function formatDateTime(timestamp) {
    if (!timestamp) return "尚未獲得";
    const date = new Date(timestamp);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;

  function syncAchievementLog() {
    let changed = false;
    getAchievements().forEach(item => {
      if (item.unlocked && !stats.achievementLog[item.id]) {

        changed = true;
      }

    const unlockedNow = current.find(id => !previousAchievements.includes(id));
    previousAchievements = current;
    if (!unlockedNow) return;
    if (!stats.achievementLog[unlockedNow]) {

  /* ===== 成長激勵系統 ===== */
  const energyConfig = {
    starThresholds: [100, 300, 700],
    ranks: [
      { title: "詩童", min: 0, max: 100, className: "rank-poem-child" },
      { title: "詩徒", min: 101, max: 300, className: "rank-poem-apprentice" },
      { title: "詩客", min: 301, max: 700, className: "rank-poem-guest" },
      { title: "詩豪", min: 701, max: 1200, className: "rank-poem-master" },
      { title: "詩聖", min: 1201, max: Infinity, className: "rank-poem-sage" }
    ],
    basePoints: 10,
    streakBonus: 3,
    difficultyBonus: { starter: 0, basic: 3, medium: 6, advanced: 10, hard: 15 },
    masteryBonus: 8
  };

  function getStarLevel(points) {
    let stars = 0;
    for (const threshold of energyConfig.starThresholds) {
      if (points >= threshold) stars++;
    }
    return stars;
  }

  function getCurrentStarThreshold() {
    const stars = getStarLevel(stats.energyPoints);
    if (stars >= energyConfig.starThresholds.length) return energyConfig.starThresholds[energyConfig.starThresholds.length - 1];
    return energyConfig.starThresholds[stars] || energyConfig.starThresholds[0];
  }

  function getNextStarThreshold() {
    const stars = getStarLevel(stats.energyPoints);
    if (stars >= energyConfig.starThresholds.length) return null;
    return energyConfig.starThresholds[stars];
  }

  function getPrevStarThreshold() {
    const stars = getStarLevel(stats.energyPoints);
    if (stars <= 0) return 0;
    return energyConfig.starThresholds[stars - 1];
  }

  function getRankIndex(points) {
    const index = energyConfig.ranks.findIndex(rank => points >= rank.min && points <= rank.max);
    return index >= 0 ? index : energyConfig.ranks.length - 1;
  }

  function getRankProgress(points) {
    const index = getRankIndex(points);
    const rank = energyConfig.ranks[index];
    const start = index === 0 ? 0 : energyConfig.ranks[index - 1].max;
    if (!Number.isFinite(rank.max)) {
      return { index, rank, current: points, total: null, percent: 100 };
    }
    const total = Math.max(1, rank.max - start);
    const current = Math.min(total, Math.max(0, points - start));
    return {
      index,
      rank,
      current,
      total,
      percent: Math.min(100, Math.max(0, (current / total) * 100))
    };
  }

  function addEnergyPoints(poem, score) {
    const level = getPoemLevel(poem);
    let points = energyConfig.basePoints;
    points += Math.min(stats.streak, 10) * energyConfig.streakBonus;
    points += (energyConfig.difficultyBonus[level] || 0);
    const fullPassed = state.practiceMode === "full" || (state.practiceMode === "line" && score.lines && score.lines.length === poem.lines.length);
    if (fullPassed && !stats.masteredIds.includes(poem.id)) {
      points += energyConfig.masteryBonus;
    }
    const prevStars = getStarLevel(stats.energyPoints);
    const prevRank = getRankIndex(stats.energyPoints);
    stats.energyPoints += points;
    saveProgress();
    updateEnergyBar(prevStars, prevRank);
    return points;
  }

  function updateEnergyBar(prevStars, prevRank) {
    const fill = document.getElementById("energyFill");
    const levelEl = document.getElementById("energyLevel");
    const pointsEl = document.getElementById("energyPoints");
    const currentStars = getStarLevel(stats.energyPoints);
    const rankProgress = getRankProgress(stats.energyPoints);

    if (!fill || !levelEl || !pointsEl) return;

    if (rankProgress.total === null) {
      fill.style.width = "100%";
      fill.classList.add("max");
    } else {
      fill.style.width = rankProgress.percent + "%";
      fill.classList.remove("max");
    }

    levelEl.textContent = rankProgress.rank.title;
    levelEl.className = `energy-level rank-badge ${rankProgress.rank.className}`;
    pointsEl.textContent = rankProgress.total === null
      ? `${stats.energyPoints} 能量 · 滿階`
      : `${rankProgress.current} / ${rankProgress.total} 能量`;

    const wrap = document.getElementById("energyBarWrap");
    if (wrap && typeof prevRank === "number" && rankProgress.index > prevRank) {
      wrap.classList.remove("rank-up");
      void wrap.offsetWidth;
      wrap.classList.add("rank-up");
      showToast(`✨ 段位提升：${rankProgress.rank.title}`);
      setTimeout(() => wrap.classList.remove("rank-up"), 1200);
    }

    for (let i = 1; i <= 3; i++) {
      const starEl = document.getElementById("star" + i);
      if (!starEl) continue;
      const wasEarned = i <= (prevStars || 0);
      const isNowEarned = i <= currentStars;
      if (isNowEarned && !wasEarned) {
        starEl.classList.add("active");
        starEl.classList.remove("earned");
        setTimeout(() => {
          starEl.classList.remove("active");
          starEl.classList.add("earned");
        }, 600);
      } else if (isNowEarned) {
        starEl.classList.add("earned");
        starEl.classList.remove("active");
      } else {
        starEl.classList.remove("active", "earned");
      }
    }
  }
