  function getCompletedConstellationCount() {
    const masteredSet = new Set(stats.masteredIds);
    return poets.filter(poet => poet.poems.length && poet.poems.every(poem => masteredSet.has(poem.id))).length;
  }

  function starMasteryPercent(poem) {
    if (stats.masteredIds.includes(poem.id)) return 100;
    const wrong = wrongs.find(item => item.id === poem.id);
    if (wrong) return Math.max(8, Math.min(78, wrong.lastScore || 25));
    const record = stats.reviewRecords[poem.id];
    if (record) return 68;
    return 0;
  }

  function buildStarMapPoints() {
    const poetCount = Math.max(1, poets.length);
    return poets.flatMap((poet, poetIndex) => {
      const clusterAngle = (poetIndex / poetCount) * Math.PI * 2 - Math.PI / 2;
      const clusterRadius = 360 + (poetIndex % 3) * 46;
      const centerX = Math.cos(clusterAngle) * clusterRadius;
      const centerY = Math.sin(clusterAngle) * clusterRadius * 0.68;
      return poet.poems.map((poem, poemIndex) => {
        const hash = stableHash(poem.id);
        const localAngle = ((poemIndex + 1) / (poet.poems.length + 1)) * Math.PI * 2 + (hash % 90) / 90;
        const localRadius = 38 + (hash % 86);
        return {
          poem,
          poet,
          x: centerX + Math.cos(localAngle) * localRadius,
          y: centerY + Math.sin(localAngle) * localRadius * 0.72,
          twinkle: (hash % 1000) / 1000
        };
      });
    });
  }

  function resizeStarMapCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);
    const targetWidth = Math.floor(width * dpr);
    const targetHeight = Math.floor(height * dpr);
    if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
      canvas.width = targetWidth;
      canvas.height = targetHeight;
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, width, height };
  }

  function starToScreen(point, width, height) {
    return {
      x: width / 2 + point.x * starMapState.scale + starMapState.offsetX,
      y: height / 2 + point.y * starMapState.scale + starMapState.offsetY
    };
  }

  function drawStarMap(canvas) {
    const { ctx, width, height } = resizeStarMapCanvas(canvas);
    const time = performance.now() / 1000;
    const masteredSet = new Set(stats.masteredIds);

    const sky = ctx.createLinearGradient(0, 0, width, height);
    sky.addColorStop(0, "#081733");
    sky.addColorStop(0.56, "#030817");
    sky.addColorStop(1, "#130d22");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 120; i++) {
      const hash = stableHash(`bg-${i}`);
      const x = (hash % 10000) / 10000 * width;
      const y = (Math.floor(hash / 10000) % 10000) / 10000 * height;
      const alpha = 0.12 + ((hash % 37) / 37) * 0.22;
      ctx.fillStyle = `rgba(255, 248, 216, ${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, 0.6 + (hash % 3) * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }

    poets.forEach(poet => {
      const poetPoints = starMapState.points.filter(point => point.poet.id === poet.id);
      if (!poetPoints.length || !poetPoints.every(point => masteredSet.has(point.poem.id))) return;
      ctx.save();
      ctx.strokeStyle = "rgba(255, 248, 216, 0.62)";
      ctx.lineWidth = 1.35;
      ctx.shadowColor = "rgba(255, 211, 122, 0.42)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      poetPoints.forEach((point, index) => {
        const screen = starToScreen(point, width, height);
        if (index === 0) ctx.moveTo(screen.x, screen.y);
        else ctx.lineTo(screen.x, screen.y);
      });
      ctx.stroke();
      ctx.restore();
    });

    starMapState.points.forEach(point => {
      const screen = starToScreen(point, width, height);
      point.screenX = screen.x;
      point.screenY = screen.y;
      const mastered = masteredSet.has(point.poem.id);
      const pulse = mastered ? 1 + Math.sin(time * 2.2 + point.twinkle * Math.PI * 2) * 0.18 : 1;
      const radius = mastered ? 4.4 * pulse : 2.8;

      ctx.save();
      if (mastered) {
        const glow = ctx.createRadialGradient(screen.x, screen.y, 0, screen.x, screen.y, 22 * pulse);
        glow.addColorStop(0, "rgba(255, 235, 166, 0.56)");
        glow.addColorStop(0.45, "rgba(53, 211, 180, 0.18)");
        glow.addColorStop(1, "rgba(255, 235, 166, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, 22 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffeaa0";
      } else {
        ctx.fillStyle = "rgba(184, 204, 219, 0.28)";
      }
      ctx.beginPath();
      ctx.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function showStarTooltip(event, canvas) {
    const tooltip = document.getElementById("starTooltip");
    if (!tooltip) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    let nearest = null;
    let nearestDistance = Infinity;

    starMapState.points.forEach(point => {
      const distance = Math.hypot((point.screenX || 0) - x, (point.screenY || 0) - y);
      if (distance < nearestDistance) {
        nearest = point;
        nearestDistance = distance;
      }
    });

    if (!nearest || nearestDistance > 18) {
      tooltip.style.display = "none";
      return;
    }

    const percent = starMasteryPercent(nearest.poem);
    tooltip.innerHTML = `<strong>《${escapeHTML(nearest.poem.title)}》</strong>${escapeHTML(nearest.poet.name)} · 掌握度 ${percent}%`;
    tooltip.style.display = "block";
    tooltip.style.left = `${Math.max(8, Math.min(x + 14, rect.width - 236))}px`;
    tooltip.style.top = `${Math.max(8, Math.min(y + 14, rect.height - 92))}px`;
  }

  function initStarMap() {
    const canvas = document.getElementById("starMapCanvas");
    const wrap = document.getElementById("starMapCanvasWrap");
    if (!canvas || !wrap) return;

    if (starMapState.animationFrame) cancelAnimationFrame(starMapState.animationFrame);
    starMapState.points = buildStarMapPoints();

    const animate = () => {
      const liveCanvas = document.getElementById("starMapCanvas");
      if (!liveCanvas) {
        starMapState.animationFrame = null;
        return;
      }
      drawStarMap(liveCanvas);
      starMapState.animationFrame = requestAnimationFrame(animate);
    };

    canvas.addEventListener("pointermove", event => {
      if (starMapState.dragging) {
        starMapState.offsetX = starMapState.dragOriginX + event.clientX - starMapState.dragStartX;
        starMapState.offsetY = starMapState.dragOriginY + event.clientY - starMapState.dragStartY;
      }
      showStarTooltip(event, canvas);
    });

    canvas.addEventListener("pointerleave", () => {
      document.getElementById("starTooltip")?.style.setProperty("display", "none");
    });

    canvas.addEventListener("pointerdown", event => {
      starMapState.dragging = true;
      starMapState.dragStartX = event.clientX;
      starMapState.dragStartY = event.clientY;
      starMapState.dragOriginX = starMapState.offsetX;
      starMapState.dragOriginY = starMapState.offsetY;
      wrap.classList.add("dragging");
      canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener("pointerup", event => {
      starMapState.dragging = false;
      wrap.classList.remove("dragging");
      canvas.releasePointerCapture?.(event.pointerId);
    });

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const beforeX = (x - rect.width / 2 - starMapState.offsetX) / starMapState.scale;
      const beforeY = (y - rect.height / 2 - starMapState.offsetY) / starMapState.scale;
      const factor = event.deltaY < 0 ? 1.12 : 0.90;
      starMapState.scale = Math.min(2.35, Math.max(0.62, starMapState.scale * factor));
      starMapState.offsetX = x - rect.width / 2 - beforeX * starMapState.scale;
      starMapState.offsetY = y - rect.height / 2 - beforeY * starMapState.scale;
    }, { passive: false });

    animate();
  }

  let pointerFrame = 0;

      document.documentElement.style.setProperty("--pointer-x", `${x}%`);
      document.documentElement.style.setProperty("--pointer-y", `${y}%`);
      document.documentElement.style.setProperty("--pointer-x-num", String(event.clientX / window.innerWidth));

  });

  document.querySelectorAll(".tab-button[data-view]").forEach(button => {
    button.addEventListener("click", () => {
      state.view = button.dataset.view;
      state.selectedAchievementId = null;
      state.selectedLibraryPoetId = null;
      state.reviewPanelOpen = false;
      resetCultureResult();
      render();
      requestAnimationFrame(() => appView.scrollTo({ top: 0, left: 0 }));
    });
  });

  document.getElementById("loginBtn").addEventListener("click", () => {
    const username = document.getElementById("loginUser").value.trim();
    const error = document.getElementById("loginError");

    if (/^\d{8}$/.test(username)) {
      state.authenticated = true;
      sessionStorage.setItem("poem-star-map-auth", "true");
      error.textContent = "";
      showCurrentScreen();
      return;
    }

    error.textContent = "教青局編號請輸入八個數字";
  });

  document.getElementById("loginPass").addEventListener("keydown", event => {
    if (event.key === "Enter") document.getElementById("loginBtn").click();
  });

  document.getElementById("changeGradeBtn").addEventListener("click", () => {
    state.selectedGrade = "";
    sessionStorage.removeItem("poem-star-map-grade");
    showCurrentScreen();
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    state.authenticated = false;
    state.selectedGrade = "";
    sessionStorage.removeItem("poem-star-map-auth");
    sessionStorage.removeItem("poem-star-map-grade");
    document.getElementById("loginPass").value = "";
    showCurrentScreen();
  });

  renderGradeGrid();
  showCurrentScreen();
</script>
</body>
</html>
